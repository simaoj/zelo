# Only cloudflared reaches this listener; no host ports are published.
server {
    listen 80;
    server_name _;
    client_max_body_size 5m;
    # Docker DNS: refresh upstream addresses after application replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $web http://web:3000;
    set $api http://api:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Replace caller-supplied forwarding chains with Cloudflare's visitor address.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header Connection "";

    location /api/ { proxy_pass $api$request_uri; }
    location / { proxy_pass $web$request_uri; }
}
